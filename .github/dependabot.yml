# Dependabot version updates.
#
# Security updates and alerts are enabled at the repository level (Settings ->
# Advanced Security) and are NOT configured here -- they need no config file.
# This file governs routine currency only.
#
# Grouping is deliberate. Every PR against this repo triggers the full CI suite
# (Docker build, Supabase + pgTAP, Playwright E2E). Ungrouped updates would open
# a PR per package, burn hours of CI a week, and produce a review queue nobody
# reads carefully -- unread merges are worse than no automation.
#
# Majors are intentionally NOT grouped: each gets its own PR and its own blast
# radius. That encodes the `product`-tier rule from the deps-refresh design spec
# (rig: docs/superpowers/specs/2026-08-28-deps-refresh-design.md) in config
# rather than relying on anyone to remember it.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # The Supabase CLI is held at 2.107.0 until #164 is resolved: under 2.116.0
    # the local stack loses role isolation and five RLS pgTAP guards fail. Left
    # unignored, the CLI bump rides into the dev-minor-patch group every week and
    # turns the whole group red (it sank #173). Remove this block when #164 closes.
    ignore:
      - dependency-name: supabase
        versions: [">2.107.0"]
    groups:
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
