name: audit

# Weekly dependency audit, separate from ci.yml on purpose.
#
# ci.yml has no event guards on verify/prod-build/rls/e2e, so adding a
# `schedule:` trigger there would run the full ~20-minute suite — Docker build,
# Supabase + pgTAP, Playwright — every week to learn nothing. This workflow runs
# only the check that actually needs a cron.
#
# Currency (are we behind?) is handled by grouped weekly Dependabot version
# updates, configured in .github/dependabot.yml. This covers the other half:
# are we vulnerable, right now, in what is already locked.
on:
  schedule:
    - cron: '0 9 * * 1' # weekly, Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to match this repo's convention; the trailing comment is the
      # tag these resolve to. Verify any bump against the upstream tag ref
      # rather than trusting a version comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=moderate
