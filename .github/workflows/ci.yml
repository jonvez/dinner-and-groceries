name: CI

# PR checks gate merges (lint + typecheck + Vitest, plus a Playwright smoke E2E).
# On merge to main, a guarded Cloud Run deploy runs (no-op only while GCP wiring
# vars are unset). See docs: docs/ci.md.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes — but NOT on `main`.
# A `main` run applies migrations to the prod database (the `migrate` job below);
# cancelling one mid-apply is survivable (each migration file is its own
# transaction and `db push` resumes from the history table) but it is not
# something to design in. So `main` runs QUEUE and PRs still cancel, which is
# where the CI-minute saving actually comes from. (ADR 0015 § 4.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Fast-path detector (#99): is this change docs-only? If so, the heavy gates
  # (prod-build, rls, e2e) skip their expensive steps but STILL report success
  # under the same check name — so branch protection stays satisfied while a
  # docs-only PR goes green in seconds instead of paying the ~10-min suite.
  # docs-only := every changed path is a Markdown file or under docs/. Anything
  # under app/ lib/ supabase/ components/ e2e/ .github/ or a config file → full
  # run (so a workflow change can never fast-path its own gates). Fails safe to
  # a FULL run whenever the diff cannot be proven docs-only.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect docs-only diff
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # Prove docs-only or fail safe to a full run.
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "Base commit unavailable — running the full suite."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$files"
          if [ -z "$files" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Any path that is NOT a .md file and NOT under docs/ forces a full run.
          if echo "$files" | grep -qvE '(^docs/|\.md$)'; then
            echo "Non-docs paths changed — running the full suite."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change — heavy gates will fast-path."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # PR gate: lint + typecheck + unit tests. Any non-zero exit blocks merge.
  # ---------------------------------------------------------------------------
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      # Full history: `migrations-monotonic.test.ts` compares the migrations this
      # branch ADDS against the ones already on the base branch, which needs the
      # merge base. A shallow clone makes that comparison impossible and the test
      # fails closed rather than skipping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

  # ---------------------------------------------------------------------------
  # PR gate: the PRODUCTION Docker image build (`next build` inside the image).
  # This catches the class of failure that the standalone `verify` typecheck
  # CANNOT: anything that compiles against the full tree but breaks once the
  # image is built with `.dockerignore` applied (e.g. a root config importing an
  # excluded dir). `next build` type-checks the copied tree, so a stale/missing
  # module surfaces here and nowhere else. No push, no GCP creds — placeholder
  # NEXT_PUBLIC_* build-args are enough to exercise the build (they are only
  # inlined into the client bundle; the service-role key is never built in).
  # ---------------------------------------------------------------------------
  prod-build:
    name: Production build (Docker)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the production image (no push) — mirrors the Cloud Run deploy build
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key \
            -t dinner-and-groceries:ci .

  # ---------------------------------------------------------------------------
  # PR gate: RLS (pgTAP) against a real ephemeral Supabase Postgres.
  # The identity household-scoping RLS (and every later slice's RLS that builds
  # on it) is the security bedrock — it can only be verified against a live
  # Postgres with multiple authenticated user contexts, which the unit `verify`
  # job (jsdom, no Docker) cannot do. This job boots the local stack and runs
  # `supabase test db` (pgTAP allow-same / deny-cross / role / invite-integrity
  # tests in supabase/tests/). Skips cleanly until migrations exist.
  # ---------------------------------------------------------------------------
  rls:
    name: RLS pgTAP (Supabase)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every step below is guarded on the docs-only fast-path (#99): a docs-only
      # diff skips the whole ephemeral-Supabase + pgTAP run, and the job still
      # reports success under this required check name.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npm ci

      # The Google OAuth provider is enabled in supabase/config.toml (issue #5)
      # and reads its client_id/secret via env(). The RLS tests never exercise
      # the OAuth flow, but GoTrue wants the vars present at boot, so we pass
      # harmless non-secret placeholders here. Real Google creds are a human/
      # Secret-Manager concern (see README "Google OAuth setup").
      # Anonymous Docker Hub pulls occasionally hit `toomanyrequests: Rate
      # exceeded`, hard-failing this (required) job on a transient, non-test
      # failure. Retry with backoff, cleaning up between attempts, so a rate
      # limit self-recovers instead of burning a re-run cycle. No-op on the
      # happy path: a first-try success just breaks out of the loop.
      - name: Start local Supabase stack
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          for attempt in 1 2 3; do
            if npx supabase start; then break; fi
            echo "supabase start failed (attempt $attempt) — cleaning up and retrying"
            npx supabase stop --no-backup || true
            sleep $((attempt * 15))
            [ "$attempt" = 3 ] && { echo "supabase start failed after 3 attempts"; exit 1; }
          done
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder-secret

      - name: Apply migrations (clean reset)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npx supabase db reset --local

      # `supabase test db` pulls pg_prove from public.ecr.aws on demand; that pull
      # occasionally times out and would fail this (required) check on a transient
      # registry hiccup. Warm the image with retries first so the test step finds it
      # cached. Best-effort: if all retries fail (sustained outage), the test step's
      # own pull is the final arbiter and fails the job legitimately.
      - name: Pre-pull pgTAP image (resilient to transient registry hiccups)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          for i in 1 2 3; do
            if docker pull public.ecr.aws/supabase/pg_prove:3.36; then break; fi
            echo "pg_prove image pull attempt $i failed; retrying in 10s..."
            sleep 10
          done

      - name: Run pgTAP RLS tests
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npx supabase test db --local

      - name: Stop local Supabase stack
        if: ${{ always() && needs.changes.outputs.docs_only != 'true' }}
        run: npx supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # PR gate: Playwright E2E against the production standalone server, now backed
  # by a real ephemeral local Supabase (issues #56 + #24). Two tiers run:
  #   * smoke   — the signed-out path (/ -> /login), no session.
  #   * authed  — the AUTHENTICATED loop: authed SSR + RLS board render,
  #               propose/react/comment, and a TWO-CONTEXT live Realtime guard
  #               that asserts reaction INSERT delivery AND DELETE (un-react)
  #               propagation between two members of one household (the automated
  #               guard for the #63 class). Sessions are seeded directly against
  #               local Supabase (email/password) — NO Google OAuth, and NO
  #               service-role key (ADR 0003 stays intact): local email
  #               confirmations are disabled so signUp returns a live session, and
  #               the household is built via the app's own authenticated RPCs.
  #
  # Ordering matters: NEXT_PUBLIC_* are inlined into the CLIENT bundle at BUILD
  # time (this repo has been bitten by this repeatedly). So we boot Supabase and
  # export its URL/anon key into $GITHUB_ENV BEFORE `npm run build`, then verify
  # the built bundle actually points at the local stack.
  # ---------------------------------------------------------------------------
  e2e:
    name: Playwright smoke E2E
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every step below is guarded on the docs-only fast-path (#99): a docs-only
      # diff skips the whole build + ephemeral-Supabase + Playwright run, and the
      # job still reports success under this required check name.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npm ci

      # GoTrue wants the Google OAuth env present at boot (config.toml references
      # it via env()); the E2E flows never touch Google — sessions are seeded via
      # email/password — so harmless non-secret placeholders suffice (same pattern
      # as the rls job).
      # Anonymous Docker Hub pulls occasionally hit `toomanyrequests: Rate
      # exceeded`, hard-failing this (required) job on a transient, non-test
      # failure. Retry with backoff, cleaning up between attempts, so a rate
      # limit self-recovers instead of burning a re-run cycle. No-op on the
      # happy path: a first-try success just breaks out of the loop.
      - name: Start ephemeral Supabase
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          for attempt in 1 2 3; do
            if npx supabase start; then break; fi
            echo "supabase start failed (attempt $attempt) — cleaning up and retrying"
            npx supabase stop --no-backup || true
            sleep $((attempt * 15))
            [ "$attempt" = 3 ] && { echo "supabase start failed after 3 attempts"; exit 1; }
          done
        env:
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder-secret

      # Feed the RUNNING stack's URL + anon key to every later step (build inline,
      # standalone server runtime, and the seed's signUp) via $GITHUB_ENV — the
      # single source of truth, so the build can't drift from the stack the tests
      # run against. The service-role key is deliberately NOT exported (ADR 0003).
      - name: Export local Supabase env
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: Apply migrations (clean reset)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npx supabase db reset --local

      # NEXT_PUBLIC_* come from $GITHUB_ENV above (the running stack), so the
      # client bundle is inlined pointing at the ephemeral local Supabase.
      - name: Build (standalone)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npm run build

      # Guard against the exact class of bug this task exists to prevent: if the
      # public env wasn't inlined at build time, the browser Supabase client (and
      # the Realtime socket) would have no backend and the authed flows would fail
      # in confusing ways. Assert the URL is actually baked into a client chunk.
      - name: Verify local Supabase URL is inlined into the client bundle
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          if ! grep -rqF "$NEXT_PUBLIC_SUPABASE_URL" .next/static/chunks; then
            echo "::error::Client bundle does not point at local Supabase — NEXT_PUBLIC_* was not inlined at build time."
            exit 1
          fi
          echo "Client bundle correctly points at $NEXT_PUBLIC_SUPABASE_URL"

      - name: Install Playwright browsers
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npx playwright install --with-deps chromium

      # The Playwright "setup" project seeds two users + one household against the
      # running stack and writes their storageState; the authed projects then run.
      - name: Run E2E (smoke + authed + live Realtime guard)
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: npm run test:e2e

      - name: Stop ephemeral Supabase
        if: ${{ always() && needs.changes.outputs.docs_only != 'true' }}
        run: npx supabase stop --no-backup

      - name: Upload Playwright report
        if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Migrate: apply supabase/migrations/ to the cloud Supabase PROD database
  # (ADR 0015, runbook docs/runbooks/prod-migrations.md). Runs on merges to main
  # only, BEFORE the app deploy, so a failed apply leaves prod on old code AND
  # old schema instead of new code on old schema — the failure this project has
  # already shipped twice (#63, /grocery 500s).
  #
  # Credential: ONE GCP Secret Manager secret, SUPABASE_MIGRATION_DB_URL (the
  # prod SESSION-pooler URI, port 5432 — transaction mode cannot run DDL), read
  # at job time by the existing keyless WIF deploy identity. No
  # SUPABASE_ACCESS_TOKEN (a PAT is account-wide), no `supabase link` state, and
  # NO new GitHub secret — ADR 0009's "nothing long-lived in GitHub" holds. The
  # value is masked before it can reach a log, is never bound to Cloud Run, and
  # `--debug` is banned here because it prints the connection string.
  #
  # `needs: rls` is deliberate: no migration reaches prod on a commit whose pgTAP
  # allow/deny suite did not pass. Required checks gate MERGES; this gates the
  # APPLY. No docs-only fast-path either — `db push` with nothing pending is a
  # sub-second no-op, so every merge doubles as a standing assertion that prod's
  # migration history matches the repo, and no path-filter bug can fail open.
  # ---------------------------------------------------------------------------
  migrate:
    name: Apply DB migrations to prod
    needs: [verify, rls, e2e]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation only; no long-lived key
    # Prod applies never overlap, whatever the trigger (a re-run of an older run
    # included). Never cancels: see the workflow-level concurrency note above.
    concurrency:
      group: prod-migrate
      cancel-in-progress: false
    steps:
      - name: Gate on GCP wiring
        id: gate
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP not wired yet (vars.GCP_PROJECT_ID unset) — migrate is a no-op stub."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm

      # The supabase CLI is a devDependency pinned at 2.107.0 (#164) — the
      # lockfile is the version of record; there is no global binary.
      - name: Install dependencies
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: npm ci

      # Keyless auth via Workload Identity Federation — same provider and same
      # deploy SA the deploy job uses; no JSON keys in the repo.
      - name: Authenticate to Google Cloud
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # ::add-mask:: is registered BEFORE the value can reach any later log line.
      # Requires secretmanager.secretAccessor on this secret for the DEPLOY SA
      # only — explicitly NOT the Cloud Run runtime compute SA (ADR 0015 § 8).
      #
      # `${URI//%/%25}`: the runner un-escapes %25 -> %, %0A -> LF and %0D -> CR in
      # workflow-command DATA, so masking a raw URI that contains any of them would
      # register a mask string that never matches the real secret — leaving the
      # credential unmasked for the whole job. The runbook mandates an alphanumeric
      # password, but that is a human instruction and this is the enforcement.
      - name: Fetch the migration connection URI from Secret Manager
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: |
          URI="$(gcloud secrets versions access latest --secret=SUPABASE_MIGRATION_DB_URL --project=${{ vars.GCP_PROJECT_ID }})"
          echo "::add-mask::${URI//%/%25}"
          echo "SUPABASE_MIGRATION_DB_URL=$URI" >> "$GITHUB_ENV"

      # Pre-flight: prod's history BEFORE anything is attempted. On a red run
      # this log line is usually the whole diagnosis (runbook § 3).
      - name: Prod migration history (pre-flight)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: npx supabase migration list --db-url "$SUPABASE_MIGRATION_DB_URL"

      # No --include-all, on purpose: a remote version missing from the repo, or
      # a pending file older than prod's history head, must exit 1 and block the
      # deploy until a human repairs it (runbook § 3.1 / § 3.2). Each file is
      # applied in its own transaction, so a failure rolls that file back whole
      # and a re-run resumes from the history table.
      - name: Apply pending migrations
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: npx supabase db push --db-url "$SUPABASE_MIGRATION_DB_URL" --yes

      # `migration list` ALWAYS exits 0, so green `db push` alone does not prove
      # prod's history matches the repo — parse it. A blank cell on either side
      # is the drift signature. With this step, a green `migrate` means the
      # repo's migration history IS prod's migration history.
      - name: Assert every repo migration is applied (post-flight)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        # `shell: bash` (not the default `bash -e {0}`) adds `-o pipefail`, so a
        # failed `migration list` is caught here instead of being swallowed by the
        # `tee` on the right of the pipe. The guards below already fail closed on
        # the resulting error text; this just reports the real cause.
        shell: bash
        run: |
          npx supabase migration list --db-url "$SUPABASE_MIGRATION_DB_URL" | tee migration-list.txt
          # Rows look like:  " 20260101000000 | 20260101000000 | 2026-01-01 00:00:00 "
          # Deliberately NOT using an interval expression ([0-9]{14}): intervals
          # are not portable across awk variants (ubuntu-latest's default awk is
          # mawk), and an awk that took `{14}` literally would match ZERO rows
          # and report success — a parser that fails OPEN, which is the one
          # outcome this step must never have. So: match any digit run, and
          # assert a nonzero row count. The repo always has >= 1 migration, so
          # "parsed nothing" means the parse broke, not that prod is clean.
          report="$(awk -F'|' '
            /^[[:space:]]*[0-9][0-9]*[[:space:]]*\|/ || /^[[:space:]]*\|[[:space:]]*[0-9][0-9]*/ {
              rows++
              l=$1; r=$2; gsub(/[[:space:]]/,"",l); gsub(/[[:space:]]/,"",r);
              if (l != r) printf "  drift: local=%s remote=%s\n", (l==""?"-":l), (r==""?"-":r)
            }
            END { printf "rows=%d\n", rows }
          ' migration-list.txt)"
          rows="$(printf '%s\n' "$report" | sed -n 's/^rows=//p')"
          drift="$(printf '%s\n' "$report" | grep '^  drift:' || true)"
          if [ "${rows:-0}" -lt 1 ]; then
            echo "::error::could not parse any migration rows out of \`migration list\` — refusing to call that success."
            exit 1
          fi
          if [ -n "$drift" ]; then
            echo "::error::prod migration history does not match the repo:"; echo "$drift"; exit 1
          fi
          # Checked AFTER the drift check so the more specific message wins: a
          # remote-ahead row also skews this count, and `drift:` names the version.
          # `rows >= 1` catches "parsed nothing" but not "parsed SOME" — a TRUNCATED
          # capture has no drift row and would report success on the strength of the
          # rows that did survive. Every repo migration appears in `migration list`
          # (applied or not), so the row count must equal the file count exactly.
          expected="$(ls supabase/migrations/*.sql | wc -l | tr -d ' ')"
          if [ "${rows:-0}" -ne "$expected" ]; then
            echo "::error::parsed $rows migration rows but the repo has $expected files — refusing to call that success."
            exit 1
          fi
          echo "Prod migration history matches the repo ($rows migrations)."

      - name: Stub notice (GCP not wired)
        if: ${{ steps.gate.outputs.enabled != 'true' }}
        run: |
          echo "Migrate stub: pipeline shape present; wire vars.GCP_* + the SUPABASE_MIGRATION_DB_URL secret to activate."

  # ---------------------------------------------------------------------------
  # Deploy: Docker build -> Artifact Registry -> Cloud Run (ADR 0009).
  # Guarded to merges on main; no-op only while GCP wiring vars are unset, so it
  # never runs on PRs and commits no real GCP credentials.
  # Auth is via Workload Identity Federation (no long-lived keys). NEXT_PUBLIC_*
  # are read from GCP Secret Manager and injected as Docker BUILD args (Next.js
  # inlines them into the client bundle at build time). The Cloud Run service is
  # --allow-unauthenticated (app enforces auth via Supabase) with --min-instances 0.
  # See docs/ci.md for the variables/secrets this expects.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloud Run
    # `migrate` first (ADR 0015 § 3): a failed apply skips the deploy entirely,
    # so prod stays coherent on the previous image + previous schema.
    needs: [verify, e2e, migrate]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      - name: Gate on GCP wiring
        id: gate
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP not wired yet (vars.GCP_PROJECT_ID unset) — deploy is a no-op stub."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}

      # Keyless auth via Workload Identity Federation — no JSON keys in the repo.
      - name: Authenticate to Google Cloud
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      # NEXT_PUBLIC_* are needed in TWO places: (1) the CLIENT bundle, where
      # `next build` inlines the *static* `process.env.NEXT_PUBLIC_*` references
      # at BUILD time (so they must be Docker build-args, fetched here); and
      # (2) the SERVER at RUNTIME — proxy.ts / server-component.ts call
      # readSupabaseEnv() which reads process.env *dynamically*, and dynamic
      # reads are NOT inlined by the build, so the running container must carry
      # them in its env (bound from Secret Manager on the deploy step below).
      # BOTH are required: build-args only ⇒ SSR 500s on every request;
      # runtime-only ⇒ the browser sign-in client throws. Secret Manager is the
      # single source of truth; the deploy SA (authed above) reads the two public,
      # non-secret values here for the build. The service-role key is NEVER
      # fetched or built in. Requires the deploy SA to hold
      # secretmanager.secretAccessor on both secrets — runbook § P3.
      - name: Fetch build-time NEXT_PUBLIC_* from Secret Manager
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_SUPABASE_URL --project=${{ vars.GCP_PROJECT_ID }})"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(gcloud secrets versions access latest --secret=NEXT_PUBLIC_SUPABASE_ANON_KEY --project=${{ vars.GCP_PROJECT_ID }})"
          } >> "$GITHUB_ENV"

      - name: Build & push image to Artifact Registry
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/dinner-and-groceries:${{ github.sha }}
          # Public (non-secret) build-time values, inlined by `next build`.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloud Run
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: dinner-and-groceries
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/dinner-and-groceries:${{ github.sha }}
          # ADR 0009: the app enforces auth via Supabase (Cloud Run IAM is NOT the
          # auth boundary), so the service is public; scale-to-zero for cost.
          flags: --allow-unauthenticated --min-instances=0
          # Runtime env for the SERVER path: middleware/server-component read
          # NEXT_PUBLIC_* from process.env dynamically at runtime (NOT inlined),
          # so bind them from Secret Manager into the running service. (The client
          # bundle already got them at BUILD time via build-args above.) The
          # runtime compute SA holds secretAccessor on these — runbook § P1.6. The
          # service-role key is never bound anywhere (RLS-always, ADR 0003).
          secrets: |
            NEXT_PUBLIC_SUPABASE_URL=NEXT_PUBLIC_SUPABASE_URL:latest
            NEXT_PUBLIC_SUPABASE_ANON_KEY=NEXT_PUBLIC_SUPABASE_ANON_KEY:latest

      - name: Stub notice (GCP not wired)
        if: ${{ steps.gate.outputs.enabled != 'true' }}
        run: |
          echo "Deploy stub: pipeline shape present; wire vars.GCP_* + WIF to activate."
